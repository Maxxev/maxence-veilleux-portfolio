<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root { color-scheme: light dark; }
    /* Aplat orange, lettres foncées — la même inversion que les boutons du
       site : l'orange est trop clair pour porter du blanc lisiblement. */
    .fond { fill: #f87a25; }
    .lettres { fill: #1d1916; }
    @media (prefers-color-scheme: dark) {
      .fond { fill: #fa9552; }
    }
  </style>
  <rect class="fond" width="64" height="64" rx="14" />
  <text
    class="lettres"
    x="32" y="43"
    text-anchor="middle"
    font-family="'Space Grotesk', 'Archivo', Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-1.5"
  >MV</text>
</svg>
